services:
  model-service:
    build: .
    environment:
      MODEL_BACKEND: sklearn
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
